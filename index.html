<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ನಮ್ಮ ಶಾಪುರ್ - ಡೆಲಿವರಿ ಬಾಯ್ ಆಪ್</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAm3HFKu101wex1b025-zJZ2BJ_o1Xvw",
      authDomain: "ar-taxi-booking-shahapur.firebaseapp.com",
      projectId: "ar-taxi-booking-shahapur",
      storageBucket: "ar-taxi-booking-shahapur.appspot.com",
      messagingSenderId: "585815710897",
      appId: "1:586815710897:web:ab7138b9c016843db95dsa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.onSnapshot = onSnapshot;
    window.updateDoc = updateDoc;
    window.doc = doc;
  </script>

  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 10px; }
    .container { max-width: 450px; margin: auto; background: white; padding: 15px; border-radius: 10px; }
    header { background: #fb8c00; color: white; padding: 10px; text-align: center; border-radius: 6px; }
    .order-box { border: 1px solid #ffb74d; background: #fff8e1; padding: 10px; border-radius: 6px; margin-top: 10px; }
    .btn { background: #4caf50; color: white; border: none; padding: 8px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h2>🛵 ಡೆಲಿವರಿ ಬಾಯ್ ಪ್ಯಾನಲ್</h2>
    </header>

    <h3>📦 ಡೆಲಿವರಿಯಾಗಬೇಕಾದ ಆರ್ಡರ್‌ಗಳು</h3>
    <div id="deliveryList"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.onSnapshot(window.collection(window.db, "orders"), (snap) => {
        let tasks = [];
        snap.forEach(d => {
          let o = d.data();
          if (o.status === 'PACKING') tasks.push({ docId: d.id, ...o });
        });
        renderDeliveryTasks(tasks);
      });
    });

    function renderDeliveryTasks(tasks) {
      const list = document.getElementById('deliveryList');
      if (tasks.length === 0) {
        list.innerHTML = '<p style="margin-top:10px;">ಯಾವುದೇ ಡೆಲಿವರಿ ಟಾಸ್ಕ್ ಇಲ್ಲ.</p>';
        return;
      }
      list.innerHTML = tasks.map(t => `
        <div class="order-box">
          <b>ವಸ್ತು: ${t.productName} (₹${t.totalPrice})</b>
          <p>ಗ್ರಾಹಕರು: ${t.customer?.name} (${t.customer?.phone})</p>
          <p>ಊರು: ${t.customer?.village}</p>
          <button class="btn" onclick="markDelivered('${t.docId}')">✅ ಡೆಲಿವರಿ ಪೂರ್ಣಗೊಳಿಸಿ (Delivered)</button>
        </div>
      `).join('');
    }

    async function markDelivered(id) {
      await window.updateDoc(window.doc(window.db, "orders", id), { status: 'DELIVERED' });
      alert("🎉 ಡೆಲಿವರಿ ಯಶಸ್ವಿಯಾಗಿದೆ!");
    }
  </script>
</body>
</html>
